ferrite-command = { path = "../ferrite-command" }
ferrite-admin = { path = "../ferrite-admin" }
ferrite-data.workspace = true
ferrite-math = { path = "../ferrite-math" }
ferrite-plugin = { path = "../ferrite-plugin" }
ferrite-profiler = { path = "../ferrite-profiler" }
ferrite-fluid = { path = "../ferrite-fluid" }
ferrite-noise = { path = "../ferrite-noise" }
