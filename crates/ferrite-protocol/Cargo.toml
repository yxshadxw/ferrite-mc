[package]
name = "ferrite-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes.workspace = true
thiserror.workspace = true
uuid.workspace = true
flate2.workspace = true
libdeflater = { version = "1", optional = true }
ferrite-nbt.workspace = true

[features]
# libdeflate is the default zlib backend for framing; without it the same API
# is served by flate2 (`--no-default-features`).
default = ["libdeflate"]
libdeflate = ["dep:libdeflater"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "protocol"
harness = false
