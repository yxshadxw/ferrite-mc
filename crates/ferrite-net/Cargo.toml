[package]
name = "ferrite-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferrite-protocol.workspace = true
ferrite-translate = { path = "../ferrite-translate" }
ferrite-nbt.workspace = true
ferrite-item = { path = "../ferrite-item", features = ["protocol"] }
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
uuid.workspace = true
serde_json.workspace = true
md5 = "0.7"
aes = "0.8"
rsa = "0.9"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
num-bigint = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "cfb8"
harness = false
